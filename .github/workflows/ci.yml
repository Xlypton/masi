name: CI

# CI floor for the Masi web port (v2 plan, Phase 0).
# The repo is local-first and not currently pushed to a remote; this workflow is
# the enforceable spec for when one exists. The same gates run locally via
# `tool/build_web.sh` and the standard `flutter analyze` / `flutter test`.
#
# NOTE: the `dart:io` gate is enforceable today — it matches import/export
# DIRECTIVES only, exactly as `tool/build_web.sh` does. A raw substring grep
# flags the seam files' doc comments (which legitimately mention `dart:io` when
# explaining the wasm conditional-import split) and can never be empty; that
# false-positive form is what used to keep this gate red on clean code.
# The `web-build` job stays continue-on-error until the Stage 2 offline-shell
# work lands, so a build regression can't block the analyze/test floor.

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are excluded: their masters were rendered on macOS and
      # `matchesGoldenFile` compares byte-exactly, so font rasterization on any
      # other host fails them and kept this job permanently red. They remain a
      # local gate on the platform that generated them — see dart_test.yaml for
      # the full reasoning and the principled fix.
      - run: flutter test --exclude-tags golden

  dart-io-gate:
    name: dart:io gate
    runs-on: ubuntu-latest
    # Enforceable: needs no Flutter toolchain, and is green on clean code.
    steps:
      - uses: actions/checkout@v4
      - name: dart:io grep gate (must be empty)
        # Keep this regex byte-identical to tool/build_web.sh — directives only,
        # never prose. Any divergence lets a real leak through or reddens on
        # comments.
        run: |
          offenders="$(grep -rlE "^[[:space:]]*(import|export)[[:space:]]+['\"]dart:io['\"]" lib --include="*.dart" | grep -v '_native.dart' || true)"
          if [ -n "$offenders" ]; then
            echo "dart:io found outside *_native.dart:"; echo "$offenders"; exit 1
          fi
          echo "ok: no dart:io outside *_native.dart"

  web-build:
    name: web build (wasm)
    runs-on: ubuntu-latest
    # Goes green with the Stage 2 offline-shell work; non-blocking until then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: build web (wasm)
        run: flutter build web --wasm
