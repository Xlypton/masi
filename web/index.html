<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Masi — visual-first climbing route topo editor. Document walls, sectors, and routes with photo-based topos.">

  <!-- MUST stay byte-identical to the string Flutter's web engine installs, at
       full_page_embedding_strategy.dart:87-92. The engine's embedding-strategy
       constructor unconditionally REMOVES every <meta name="viewport"> on the
       page (the `viewportMeta.remove()` at :86 is outside the assert, so it
       happens in release too) and appends its own -- after the browser has
       already laid the page out with ours.
       Any difference between the two therefore becomes a mid-life viewport
       change. That matters more here than on most Flutter web apps: on iOS the
       engine takes its ONE geometry input from
       `document.documentElement.clientWidth/clientHeight` -- the LAYOUT
       viewport (full_page_dimensions_provider.dart:71-84) -- while the only
       resize it subscribes to is the VISUAL viewport (:29-36), so it cannot
       observe a layout-viewport-only change and has no path to invalidate it.
       Ours used to carry `viewport-fit=cover`, which made the swap flip
       viewport-fit cover->contain a beat after boot: the whole view translated
       and its bottom clipped, and touches landed off painted content until a
       real rotation forced WebKit to re-resolve. Matching the engine's string
       makes the swap a no-op instead.
       `viewport-fit=cover` also bought this app nothing: web reports
       MediaQuery.viewPadding/padding as a const zero (window.dart:97,
       platform_dispatcher.dart:1782-1784), so no safe-area inset can reach a
       widget, and nothing here reads env(safe-area-inset-*). The app's notch
       clearance comes precisely FROM the engine's non-cover viewport, which is
       why matching it is the safe direction and keeping `cover` was not.
       Pinned by test/web_geometry_source_test.dart, which compares this string
       against the installed SDK's. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F1F9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100D17">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent (NOT default): the status bar is transparent so the
       app's theme-aware html/body background (light #F3F1F9 / dark #100D17,
       below) paints right through it — seamless in both themes. `default`
       reserves an opaque, non-theme-aware strip that meets the app background
       below it, showing a hairline seam at the top in both light and dark
       (bug #74). That seam fix depends ONLY on this style plus the root
       background — not on the viewport meta.
       Content stays clear of the notch because the engine's own replacement
       viewport meta omits viewport-fit, so iOS starts the layout viewport
       below the status bar. It is NOT because an inset reaches MediaQuery:
       on web viewPadding/padding are a const zero, so every SafeArea(top:)
       in this app contributes exactly nothing. The bottom nav clears the home
       indicator via an explicit 32px floor in nav_shell.dart, also not an
       inset. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masi</title>

  <!-- Open Graph — shareable topo links unfurl with brand + a real description. -->
  <meta property="og:title" content="Masi">
  <meta property="og:description" content="Visual-first climbing route topo editor — document walls, sectors, and routes with photo-based topos.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background: #F3F1F9;
      height: 100%;
      margin: 0;
      padding: 0;
      /* Mobile-web polish: the page itself never scrolls, rubber-bands, or
         pull-to-refreshes — the Flutter app owns all scrolling and gestures. */
      overflow: hidden;
      overscroll-behavior: none;
      /* Canvas drags must not become text selection or long-press callouts. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Theme-aware shell background: ThemeMode.system means mobile browser
       chrome / safe areas must match the app's light/dark background, not a
       hardcoded dark value (otherwise light mode gets ugly black bars). */
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #100D17;
      }
    }

    /* No `height: 100dvh` override here, deliberately. `height: 100%` above
       resolves against the initial containing block — i.e. the viewport — so
       <body>'s box cannot diverge from the `position: fixed; inset: 0` the
       engine applies to it (full_page_embedding_strategy.dart:50-58). `100dvh`
       CAN diverge from the viewport, and combined with the engine's
       top:0/bottom:0 it over-constrains that fixed box (CSS resolves the
       conflict by ignoring `bottom`), leaving <body> a different height from
       the viewport for no benefit. It never helped the collapsing-browser-
       chrome case it was added for either: the root element's clientHeight is
       the viewport height regardless of <html>'s own height, so this rule was
       never in the engine's measurement path. */

    /* #74's cosmetic 1px hairline fix (this comment marks where it lived —
       a standalone-only rule that set flutter-view's `top` offset to
       -2px, `!important`, plus the clientHeight/clientWidth alias script
       further below) was REMOVED 2026-08-05. It caused a real bug: on the
       installed iOS PWA, touch
       targets were displaced from painted content (Google sign-in appeared
       dead because taps were landing off the button entirely).
       Root cause: `<flutter-view>`'s CSS box — the SAME box the web engine
       paints into and measures native pointer events against, via
       `computeEventOffsetToTarget` — is sized on iOS directly from
       `document.documentElement.clientHeight/clientWidth`
       (full_page_dimensions_provider.dart). Aliasing those getters to
       `window.innerHeight/innerWidth` UNCONDITIONALLY (not scoped to one
       boot frame) defeated the engine's own iOS-specific correctness fix
       and could leave the mismatch UNSETTLED instead of self-correcting.
       Neither this alias nor the `top: -2px` rule was ever verified on a
       real installed iOS PWA before shipping — only via headless Chrome,
       which cannot execute the standalone code path at all. The #74
       hairline is an accepted, known, COSMETIC regression now that both
       are gone; see test/web_geometry_source_test.dart, which pins their
       absence. */

    /* Branded splash shown while the Flutter engine boots. Removed once the
       first frame is painted (see the `flutter-first-frame` listener below),
       so there is never a flash of blank/white background on load. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3F1F9;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    @media (prefers-color-scheme: dark) {
      #splash {
        background: #100D17;
      }
    }

    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Masi">
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    REMOVED 2026-08-05: an inline script here used to alias
    document.documentElement.clientHeight/clientWidth to
    window.innerHeight/innerWidth (flutter/flutter#84833 first-paint fix for
    the #74 hairline). On iOS, Flutter's web engine sizes `<flutter-view>`'s
    CSS box — the SAME box it paints into and measures native pointer events
    against — directly from clientHeight/clientWidth
    (full_page_dimensions_provider.dart). Aliasing those getters
    UNCONDITIONALLY (not just for the first frame) defeated the engine's own
    iOS-specific correctness fix (it deliberately avoids `visualViewport` on
    iOS due to a WebKit rotation bug) and could leave the view geometry
    unsettled instead of self-correcting after one frame. Result: on the
    installed iOS PWA, touch input landed away from painted content — the
    "Continue with Google" button looked dead because taps on it never
    reached it. Never verified on a real installed iOS PWA before shipping.
    See test/web_geometry_source_test.dart, which pins this override's
    absence. Removing it means the original one-frame cosmetic hairline can
    reappear — accepted; see commit history for #74.
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter web dispatches this event on `window` once the first frame has
    // been painted. Use it to fade out/remove the branded splash above
    // instead of leaving it up forever or hiding it on a timer.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;

      splash.classList.add('splash-hidden');
      setTimeout(function () {
        splash.remove();
      }, 300);
    });

    // --- Offline shell (design doc §2b) ---------------------------------
    // Registered HERE, not by the Flutter loader: `tool/build_web.sh` builds
    // with `--pwa-strategy=none`, so `flutter_bootstrap.js` ends in a bare
    // `_flutter.loader.load();` and never touches navigator.serviceWorker.
    // That is deliberate — with Flutter's serviceWorkerSettings still emitted,
    // the loader would see OUR registration, register its own deprecated
    // worker at the same scope, and that shim's activate handler would
    // `unregister()` itself and `client.navigate()` every client: bug #55's
    // reload dance on every other load, plus no offline shell at all.
    //
    // Registration is on `load` so it never competes with the first paint for
    // bandwidth. Failure is logged and ignored — no service worker just means
    // no offline shell, never a broken app (private browsing and some
    // enterprise policies block registration outright).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          console.warn('masi/sw: registration failed:', error);
        });
      });
      navigator.serviceWorker.addEventListener('message', function (event) {
        var data = event.data;
        if (!data) return;
        if (data.type === 'masi-warm-done') {
          // Read by the Account screen's storage-diagnostics row (§2c). NOT a
          // precondition of tool/verify_offline_shell.py's offline assertion
          // any more: waiting for it there structurally masked the whole
          // renderer bug class, because it only ever becomes true on a load
          // that PAINTED.
          window.__masiShellWarmed = true;
          console.log(
            'masi/sw: warmed ' + data.cached + '/' + data.total +
            ' (version ' + data.version + ')'
          );
          return;
        }
        if (data.type === 'masi-observed-done') {
          // Cumulative across batches — the reporter below posts more than
          // once. tool/verify_offline_shell.py polls these to know the early
          // reporter has actually landed before it kills the origin.
          // `__masiObservedStored` is the load-bearing one: it lists what the
          // OBSERVED path newly stored, as opposed to found already present, so
          // a cache entry can be attributed to this reporter rather than to the
          // first-frame warm.
          window.__masiObservedAcks = (window.__masiObservedAcks || 0) + 1;
          window.__masiObservedCached =
            (window.__masiObservedCached || 0) + (data.cached || 0);
          window.__masiObservedStored =
            (window.__masiObservedStored || []).concat(data.stored || []);
          console.log(
            'masi/sw: observed ' + data.cached + '/' + data.total +
            ' (stored ' + (data.stored || []).length +
            ', version ' + data.version + ')'
          );
        }
      });
    }

    // --- Early observed-resource reporter -------------------------------
    //
    // THE PAGE IS THE AUTHORITY ON WHICH RENDERER THE LOADER PICKED.
    //
    // `web/sw.js`'s install-time `rendererArtifacts()` is a guess and can only
    // ever be a guess: a ServiceWorker has no `document`, so it cannot run the
    // loader's `detectWebGLVersion()` probe. The loader's real rule is
    // `supportsWasmGC && webGLVersion > 0 && wasmAllowList[engine]`
    // (flutter_web_sdk/flutter_js/src/loader.js:13-14), and when WebGL is
    // absent it falls back to dart2js/canvaskit, after which
    // `canvaskit_loader.js:15-22` picks the *chromium* canvaskit variant on
    // blink. So a blink browser WITHOUT WebGL — GPU blocklisted,
    // `--disable-gpu`, WebGL disabled by enterprise policy, some VM/RDP
    // sessions, and this repo's own headless harness — needs
    // `main.dart.js` + `canvaskit/chromium/canvaskit.{js,wasm}` while the
    // worker confidently precached `canvaskit/skwasm.*`. No smarter heuristic
    // fixes that inside a worker.
    //
    // This page, however, HAS a document, and rather than duplicate the
    // loader's logic we simply observe what it actually fetched:
    // `PerformanceObserver` with `{type:'resource', buffered:true}`, which
    // includes entries that completed before the observer existed, so nothing
    // is missed however early boot is. It is authoritative by construction.
    //
    // Deliberately NOT gated on `flutter-first-frame`. The warm pass further
    // down is, and that is precisely why it cannot fix this: it never runs at
    // all on a load that fails to paint, which is exactly the load we are
    // trying to repair. This reporter fires long before first paint. The warm
    // stays as a harmless final backstop for anything lazily loaded after
    // paint.
    //
    // The post goes to `registration.active`, NOT
    // `navigator.serviceWorker.controller`: on a FIRST visit the page is
    // uncontrolled and `controller` is `null`, so a controller-based post is a
    // silent no-op — and the first visit is the one that has to populate the
    // cache before the user ever goes offline.
    //
    // Every part of this runs on every page load, so every part of it is
    // wrapped: a browser without `PerformanceObserver`, without a service
    // worker, or with registration blocked degrades silently to the previous
    // behaviour and can never throw into the boot path.
    (function () {
      try {
        if (!('serviceWorker' in navigator)) return;
        if (typeof PerformanceObserver !== 'function') return;
        if (!window.performance) return;

        var prefix = location.origin + '/';
        var seen = Object.create(null);
        var pending = [];
        var worker = null;
        var timer = null;
        window.__masiObservedPosted = 0;
        window.__masiObservedAcks = 0;
        window.__masiObservedCached = 0;
        window.__masiObservedStored = [];

        function flush() {
          timer = null;
          if (!worker || pending.length === 0) return;
          var batch = pending;
          pending = [];
          try {
            worker.postMessage({ type: 'masi-observed', urls: batch });
            window.__masiObservedPosted += batch.length;
          } catch (error) {
            console.warn('masi/sw: observed post failed:', error);
          }
        }

        // One message per batch, not per resource: boot fetches dozens of
        // assets and each `postMessage` costs a structured clone plus a worker
        // task. A short debounce coalesces the burst while still landing well
        // inside the boot window.
        function schedule() {
          if (timer !== null || !worker || pending.length === 0) return;
          timer = setTimeout(flush, 200);
        }

        function collect(entries) {
          for (var i = 0; i < entries.length; i++) {
            var name = entries[i] && entries[i].name;
            if (typeof name !== 'string') continue;
            if (name.indexOf(prefix) !== 0) continue;   // cross-origin: not ours
            if (seen[name]) continue;
            seen[name] = true;
            pending.push(name);
          }
          schedule();
        }

        function listener(list) {
          try { collect(list.getEntries()); } catch (_) {}
        }

        try {
          new PerformanceObserver(listener).observe({
            type: 'resource',
            buffered: true,
          });
        } catch (_) {
          // The `{type, buffered}` form is not universal; the older
          // `entryTypes` form loses buffered entries but is better than
          // nothing. If neither is accepted, give up silently.
          try {
            new PerformanceObserver(listener).observe({
              entryTypes: ['resource'],
            });
          } catch (__) { return; }
        }

        // `ready` resolves once there IS an active worker for this scope, which
        // on a first visit is only after our `load`-time registration installs
        // and activates. Everything observed before then is buffered above and
        // flushed here.
        navigator.serviceWorker.ready.then(function (registration) {
          worker = registration.active;
          if (!worker) return;
          flush();
        }).catch(function (error) {
          console.warn('masi/sw: observed handoff failed:', error);
        });
      } catch (error) {
        // Boot must never depend on this.
        try { console.warn('masi/sw: observer unavailable:', error); } catch (_) {}
      }
    })();

    window.addEventListener('flutter-first-frame', function () {
      // A DOM-free "the app is actually running" signal. The Flutter app
      // renders to a canvas, so there is no element a WebDriver harness can
      // look for; this flag is what tool/verify_offline_shell.py polls.
      window.__masiFirstFrame = true;

      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.ready.then(function (registration) {
        var worker = registration.active || navigator.serviceWorker.controller;
        if (!worker) return;
        // BACKSTOP ONLY. The early reporter above already posted the renderer
        // (and everything else same-origin) long before this point, and unlike
        // this hook it runs on loads that never paint. This final sweep is
        // kept because it is free — `cacheMissing` skips what is already
        // stored — and it is the only thing that catches an asset fetched
        // lazily AFTER the first frame. It must never be the mechanism the
        // offline shell depends on; see tool/verify_offline_shell.py, which
        // deliberately kills the origin before this can run.
        var prefix = location.origin + '/';
        var urls = performance.getEntriesByType('resource')
          .map(function (entry) { return entry.name; })
          .filter(function (name) { return name.indexOf(prefix) === 0; });
        worker.postMessage({ type: 'masi-warm', urls: urls });
      }).catch(function (error) {
        console.warn('masi/sw: warm failed:', error);
      });
    });

    // Long-press / right-click context menu must never interrupt canvas
    // interaction on web.
    window.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // PWA install capture (Android/Chromium). iOS Safari never fires this.
    let _masiDeferredPrompt = null;
    window.__masiCanInstall = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      _masiDeferredPrompt = e;
      window.__masiCanInstall = true;
    });
    window.addEventListener('appinstalled', function () {
      _masiDeferredPrompt = null;
      window.__masiCanInstall = false;
      // Bridge-style diagnostic mirror of the same event, following the
      // __masiStandalone/__masiCanInstall pattern above: a monotonic counter
      // (never a plain boolean) so it can be read as "has this fired at
      // least once" without a reset step. NOT the mechanism that actually
      // re-asks navigator.storage.persist() — nothing here polls this value.
      // The real trigger is a direct `window.addEventListener('appinstalled',
      // ...)` registered from Dart (`storage_persistence_web.dart`'s
      // `listenForAppInstalled`, wired in `lib/main.dart`), the same native
      // event this handler is already listening to — so Dart hears it the
      // instant it fires, not on some later poll.
      window.__masiAppInstalledCount = (window.__masiAppInstalledCount || 0) + 1;
    });
    window.masiPromptInstall = async function () {
      if (!_masiDeferredPrompt) return 'unavailable';
      _masiDeferredPrompt.prompt();
      const choice = await _masiDeferredPrompt.userChoice;
      _masiDeferredPrompt = null;
      window.__masiCanInstall = false;
      return choice && choice.outcome ? choice.outcome : 'dismissed';
    };
    function _masiUpdateStandalone() {
      window.__masiStandalone =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    }
    _masiUpdateStandalone();
    if (window.matchMedia) {
      try { window.matchMedia('(display-mode: standalone)').addEventListener('change', _masiUpdateStandalone); } catch (_) {}
    }
  </script>
</body>
</html>
