<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Masi — visual-first climbing route topo editor. Document walls, sectors, and routes with photo-based topos.">

  <!-- Mobile-first viewport: notch/home-indicator-safe (iPhone) via viewport-fit=cover. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F1F9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100D17">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent (NOT default): the status bar is transparent so the
       app's theme-aware html/body background (light #F3F1F9 / dark #100D17,
       below) paints right through it — seamless in both themes. `default`
       reserves an opaque, non-theme-aware strip that meets the app background
       below it, showing a hairline seam at the top in both light and dark
       (bug #74). Content stays clear of the notch because viewport-fit=cover
       feeds the top safe-area inset into Flutter's MediaQuery (same mechanism
       that lifts the bottom nav off the home indicator, #63). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masi</title>

  <!-- Open Graph — shareable topo links unfurl with brand + a real description. -->
  <meta property="og:title" content="Masi">
  <meta property="og:description" content="Visual-first climbing route topo editor — document walls, sectors, and routes with photo-based topos.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background: #F3F1F9;
      height: 100%;
      margin: 0;
      padding: 0;
      /* Mobile-web polish: the page itself never scrolls, rubber-bands, or
         pull-to-refreshes — the Flutter app owns all scrolling and gestures. */
      overflow: hidden;
      overscroll-behavior: none;
      /* Canvas drags must not become text selection or long-press callouts. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Theme-aware shell background: ThemeMode.system means mobile browser
       chrome / safe areas must match the app's light/dark background, not a
       hardcoded dark value (otherwise light mode gets ugly black bars). */
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #100D17;
      }
    }

    /* Dynamic viewport height so the app fills the screen as mobile browser
       chrome expands/collapses (falls back to height:100% where unsupported). */
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
      }
    }

    /* #74 residual: on an installed iOS PWA, WebKit antialiases the top edge
       of Flutter's canvas layer against the page background into a faint
       hairline. Overscan the Flutter host up 2px (standalone only) so the
       seam falls into the blank top safe-area, off-screen. In-browser tabs
       don't show the seam. Cosmetic; Flutter's logical size is effectively
       unchanged. Do NOT extend this to flt-glass-pane/flt-scene-host/canvas —
       those carry a scale transform and forcing them breaks rendering. */
    @media all and (display-mode: standalone) {
      flutter-view {
        top: -2px !important;
      }
    }

    /* Branded splash shown while the Flutter engine boots. Removed once the
       first frame is painted (see the `flutter-first-frame` listener below),
       so there is never a flash of blank/white background on load. */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3F1F9;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }

    @media (prefers-color-scheme: dark) {
      #splash {
        background: #100D17;
      }
    }

    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Masi">
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // iOS Safari PWA first-paint fix (flutter/flutter#84833): on WebKit,
    // Flutter's web engine sizes its view from
    // document.documentElement.clientHeight/clientWidth rather than
    // window.innerHeight/innerWidth. On a cold-launched standalone PWA that
    // value is briefly unsettled (missing the viewport-fit=cover safe-area
    // adjustment), so Flutter's canvas paints a few px short of the true top
    // edge for one frame, exposing a hairline strip at the top until any
    // relayout (e.g. a back-navigation) makes WebKit settle it. Aliasing the
    // getters to the already-correct window.innerHeight/innerWidth makes the
    // very first read correct. Inert on Chrome/Android (Flutter doesn't read
    // clientHeight there).
    Object.defineProperty(document.documentElement, 'clientHeight', {
      get: function () { return window.innerHeight; },
      configurable: true,
    });
    Object.defineProperty(document.documentElement, 'clientWidth', {
      get: function () { return window.innerWidth; },
      configurable: true,
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter web dispatches this event on `window` once the first frame has
    // been painted. Use it to fade out/remove the branded splash above
    // instead of leaving it up forever or hiding it on a timer.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hidden');
      setTimeout(function () {
        splash.remove();
      }, 300);
    });

    // Long-press / right-click context menu must never interrupt canvas
    // interaction on web.
    window.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // PWA install capture (Android/Chromium). iOS Safari never fires this.
    let _masiDeferredPrompt = null;
    window.__masiCanInstall = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      _masiDeferredPrompt = e;
      window.__masiCanInstall = true;
    });
    window.addEventListener('appinstalled', function () {
      _masiDeferredPrompt = null;
      window.__masiCanInstall = false;
    });
    window.masiPromptInstall = async function () {
      if (!_masiDeferredPrompt) return 'unavailable';
      _masiDeferredPrompt.prompt();
      const choice = await _masiDeferredPrompt.userChoice;
      _masiDeferredPrompt = null;
      window.__masiCanInstall = false;
      return choice && choice.outcome ? choice.outcome : 'dismissed';
    };
    function _masiUpdateStandalone() {
      window.__masiStandalone =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true;
    }
    _masiUpdateStandalone();
    if (window.matchMedia) {
      try { window.matchMedia('(display-mode: standalone)').addEventListener('change', _masiUpdateStandalone); } catch (_) {}
    }
  </script>
</body>
</html>
