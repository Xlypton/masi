name: masi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.0.0
  image_picker: ^1.2.2
  image: ^4.9.1
  go_router: ^17.3.0
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.3
  supabase_flutter: ^2.16.0
  connectivity_plus: ^7.2.0
  flutter_map: ^8.2.2
  # Vector basemap for flutter_map. Chosen over the better-known
  # `vector_map_tiles`, which declares no web support because it depends on
  # `path_provider` — a non-starter for a web-first app. This one renders on
  # web with CanvasKit/skwasm, and takes an injected `http.Client`, which is
  # where `VectorTileHttpCache` hooks the browser tile cache in.
  flutter_map_vector_tiles: ^2.8.1
  latlong2: ^0.9.1
  # Grapheme/rune-safe string slicing (email_initials.dart) — was already a
  # transitive dep via the Flutter SDK, now declared directly since it's
  # imported directly.
  characters: ^1.4.1
  geolocator: ^14.0.3
  # Direct dep (was transitive via supabase_flutter et al.) so
  # `community_screen.dart` can build a resilient tile-fetch `RetryClient`
  # (see `buildResilientTileProvider`) without tripping
  # `depend_on_referenced_packages`.
  http: ^1.6.0
  # Opens beta-video URLs (#41) externally from the route metadata sheet /
  # legend / community detail screen.
  url_launcher: ^6.3.2
  # Web-only photo byte store: cross-platform IndexedDB shim. Its native-web
  # backend is built on package:web + dart:js_interop (dart2wasm-clean, no
  # dart:html/dart:indexed_db) and it ships an in-memory factory usable in
  # plain VM unit tests (see photo_byte_store_test.dart).
  idb_shim: ^2.9.6+2
  # Web-only thumbnail generation backend (image_ops_web.dart): browser
  # offscreen-canvas decode/resize/encode via dart:js_interop, wasm-clean.
  web: ^1.1.0
  # Direct dep (was transitive via the Flutter SDK, source: sdk) so
  # main.dart's `usePathUrlStrategy()` call (path-based browser URLs, e.g.
  # for shareable /community/topo/:wallId links) doesn't trip
  # `depend_on_referenced_packages`. `usePathUrlStrategy()` itself no-ops on
  # native (conditional-import stub picked whenever `dart.library.ui_web`
  # is unavailable), so this has no native effect.
  flutter_web_plugins:
    sdk: flutter
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  # Used directly (not just transitively via drift) by
  # test/core/db/app_database_migration_test.dart to hand-build a raw v1
  # schema sqlite file for the v1->v2 migration test.
  sqlite3: ^3.3.4
  # Used directly (not just transitively via path_provider) by
  # test/features/ar/presentation/ar_screen_test.dart to fake out
  # getApplicationDocumentsDirectory() for ArScreen's photo-path resolution.
  path_provider_platform_interface: ^2.1.3

flutter_launcher_icons:
  image_path: "assets/icon/masi_icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/masi_icon.png"
    background_color: "#100D17"
    theme_color: "#100D17"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/masi/
    - assets/fonts/Roboto_LICENSE.txt
    # NOTE: `assets/test/` is deliberately NOT listed. It held a 9.9 MB AR
    # fixture (`crag_sample.jpg`) whose only consumer is the manually-invoked
    # `integration_test/ar_seg_channel_test.dart`, yet it shipped in every
    # production bundle on every platform. The fixture now lives, un-bundled,
    # in `test_fixtures/`; `tool/drive_ar_seg.sh` stages it into `assets/test/`
    # (git-ignored) only for the duration of that one drive. Do not re-add it
    # here — see that script's header for the full rationale.
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Bundles Roboto locally, same-origin, under the family name `Roboto`
  # EXACTLY — that literal name is not cosmetic, it is what suppresses a
  # cross-origin fetch on the boot path on BOTH web renderers:
  #   - skwasm:    flutter_web_sdk/lib/_skwasm_impl/skwasm_impl/
  #                font_collection.dart:66 — `if (!manifest.families.any(
  #                (family) => family.name == 'Roboto'))` skips adding the
  #                remote-fetching FontFamily only when a family already
  #                named exactly 'Roboto' is present in our own manifest.
  #   - canvaskit: flutter_web_sdk/lib/_engine/engine/canvaskit/fonts.dart:
  #                99-116 — the same literal-'Roboto' check before queueing
  #                `_downloadFont('Roboto', _robotoUrl, 'Roboto')`.
  # Both renderers also default EVERY TextStyle with a null fontFamily
  # (which is all of `MasiTheme`'s TextTheme, see lib/app/theme.dart) to the
  # family 'Roboto' at the engine level
  # (font_collection.dart:23, `setDefaultFontFamilies(['Roboto'])`), so this
  # is not introducing a new look on web — it is what makes the ALREADY
  # requested default font load from our own origin (and therefore from the
  # service worker's precache) instead of https://fonts.gstatic.com, which
  # that fetch has no timeout and is awaited before first frame. Native
  # (iOS/Android) is unaffected: ThemeData never sets `fontFamily`, so it
  # keeps rendering San Francisco/system-default there.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
